name: Genomics Medicine Ireland
description: >-
  Genomics Medicine Ireland (GMI) is a Dublin-based life-sciences company founded in 2015 to build
  a large-scale Irish genomic and clinical research programme, sequencing volunteer participant DNA
  and pairing it with longitudinal phenotypic data to study the genetic basis of common and rare
  diseases such as Alzheimer's, heart failure, inflammatory bowel disease and multiple sclerosis.
  GMI was absorbed into WuXi NextCODE and subsequently rebranded as Genuity Science (genuitysci.com),
  a precision-medicine business offering disease-enriched genomic cohorts, whole-genome and
  next-generation sequencing through a clinically accredited lab, and population-scale data-analysis
  services to pharmaceutical and biotech partners for target discovery and biomarker identification.
  As a genomics research and data-services organization it exposes no public developer API, portal,
  SDKs or OpenAPI; this profile is maintained in the API Evangelist network as a company/portfolio
  lead and carries only the artifacts that can be honestly derived or probed for it.
